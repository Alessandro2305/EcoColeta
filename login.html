<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="login.css">
    <title>EcoColeta</title>
</head>

<body>
    <div class="header">
        <img src="img/icon.png" alt="lixo">
        <h1>Eco<span>Coleta</span></h1>

        <p>Cidade mais limpa, Vida melhor</p>
    </div>

    <form class="form-login" onsubmit="realizarLogin(event)">
        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="E-mail" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginSenha" placeholder="Senha" required>
        </div>

        <button class="btn-login" type="submit">ENTRAR</button>

        <p class="toggle-auth">Não tem uma conta? <a href="cadastro.html" id="toCadastro">Cadastre-se</a></p>
    </form>

    <h6>Seus dados são usados para organizar as solicitações de coleta.</h6>

    <script src="script.js"></script>
</body>

</html>
